<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janna Wallet — Swap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #00c853; --bg: #070b07; --sidebar: #0d120d; --card: #111811; --text: #fff; --muted: #8a9a8a; --border: #1a2a1a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 24px 16px; }
    .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 8px; }
    .logo-img { width: 40px; height: 40px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; }
    .logo-text { font-weight: 700; font-size: 1.2rem; }
    .nav-item { padding: 12px 16px; border-radius: 8px; color: var(--muted); text-decoration: none; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
    .nav-item:hover, .nav-item.active { background: #1a2a1a; color: var(--green); }
    .main { flex: 1; padding: 24px 32px; }
    .btn { background: var(--green); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; width: 100%; margin-top: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 480px; margin: 0 auto; }
    .swap-row { background: #0d140d; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    input, select { background: transparent; border: none; color: #fff; font-size: 1.2rem; width: 100%; outline: none; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { body { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-img">J</div>
      <div class="logo-text">Janna Wallet</div>
    </div>
    <a href="/" class="nav-item">🏠 Dashboard</a>
    <a href="/wallets" class="nav-item">💼 Wallets</a>
    <a href="/swap" class="nav-item active">🔄 Swap</a>
    <a href="/earn" class="nav-item">📈 Earn</a>
    <a href="/settings" class="nav-item">⚙️ Settings</a>
  </aside>
  <main class="main">
    <h1 style="font-size:1.8rem; margin-bottom:8px;">Swap</h1>
    <p class="muted" style="margin-bottom:32px;">Swap tokens across Ethereum, Solana, and Canton</p>
    <div class="card">
      <div class="swap-row">
        <div class="muted" style="font-size:0.85rem; margin-bottom:8px;">From</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <input type="number" id="fromAmount" value="1" placeholder="0.0" step="any" min="0">
          <select id="fromToken">
            <option value="ETH">ETH</option>
            <option value="SOL">SOL</option>
            <option value="CC">CC</option>
          </select>
        </div>
      </div>
      <div style="text-align:center; margin:8px 0; color:var(--green);">↓</div>
      <div class="swap-row">
        <div class="muted" style="font-size:0.85rem; margin-bottom:8px;">To</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <input type="text" id="toAmount" value="0" placeholder="0.0" readonly>
          <select id="toToken">
            <option value="SOL">SOL</option>
            <option value="ETH">ETH</option>
            <option value="CC">CC</option>
          </select>
        </div>
      </div>
      <p class="muted" style="font-size:0.85rem; margin:12px 0;" id="rateDisplay">Fetching rate...</p>
      <button class="btn" onclick="doSwap()">Swap Now</button>
    </div>
  </main>

  <script>
    let prices = { ETH: 0, SOL: 0, CC: 0 };

    async function fetchPrices() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum,solana&vs_currencies=usd');
        const data = await res.json();
        prices.ETH = data.ethereum?.usd || 2500;
        prices.SOL = data.solana?.usd || 150;
        prices.CC = 0.5; // Placeholder for Canton (no public price yet)
        updateRate();
      } catch (e) {
        console.error('Price fetch failed', e);
        prices = { ETH: 2500, SOL: 150, CC: 0.5 };
        updateRate();
      }
    }

    function updateRate() {
      const from = document.getElementById('fromToken').value;
      const to = document.getElementById('toToken').value;
      const amount = parseFloat(document.getElementById('fromAmount').value) || 0;

      if (from === to) {
        document.getElementById('toAmount').value = amount.toFixed(4);
        document.getElementById('rateDisplay').textContent = 'Same token';
        return;
      }

      const fromUsd = (prices[from] || 1) * amount;
      const toAmount = fromUsd / (prices[to] || 1);
      document.getElementById('toAmount').value = toAmount.toFixed(4);
      const rate = (prices[from] || 1) / (prices[to] || 1);
      document.getElementById('rateDisplay').textContent = `Rate: 1 ${from} ≈ ${rate.toFixed(4)} ${to} (live)`;
    }

    function doSwap() {
      const from = document.getElementById('fromToken').value;
      const to = document.getElementById('toToken').value;
      const amount = document.getElementById('fromAmount').value;
      const received = document.getElementById('toAmount').value;
      alert(`Swap demo: ${amount} ${from} → ${received} ${to}\\n(Connect wallet to execute real swap)`);
    }

    document.getElementById('fromAmount').addEventListener('input', updateRate);
    document.getElementById('fromToken').addEventListener('change', updateRate);
    document.getElementById('toToken').addEventListener('change', updateRate);

    fetchPrices();
  </script>
</body>
</html>
