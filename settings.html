<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janna Wallet — Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #00c853; --bg: #070b07; --sidebar: #0d120d; --card: #111811; --text: #fff; --muted: #8a9a8a; --border: #1a2a1a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 24px 16px; }
    .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 8px; }
    .logo-img { width: 40px; height: 40px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; }
    .logo-text { font-weight: 700; font-size: 1.2rem; }
    .nav-item { padding: 12px 16px; border-radius: 8px; color: var(--muted); text-decoration: none; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
    .nav-item:hover, .nav-item.active { background: #1a2a1a; color: var(--green); }
    .main { flex: 1; padding: 24px 32px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; max-width: 600px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { body { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-img">J</div>
      <div class="logo-text">Janna Wallet</div>
    </div>
    <a href="janna-wallet-dashboard.html" class="nav-item">🏠 Dashboard</a>
    <a href="wallets.html" class="nav-item">💼 Wallets</a>
    <a href="swap.html" class="nav-item">🔄 Swap</a>
    <a href="earn.html" class="nav-item">📈 Earn</a>
    <a href="settings.html" class="nav-item active">⚙️ Settings</a>
  </aside>
  <main class="main">
    <h1 style="font-size:1.8rem; margin-bottom:8px;">Settings</h1>
    <p class="muted" style="margin-bottom:32px;">Account and security settings</p>
    <div class="card">
      <div class="setting-row">
        <div><strong>Language</strong><div class="muted">English</div></div>
        <span style="color:var(--green);">Change</span>
      </div>
      <div class="setting-row">
        <div><strong>Theme</strong><div class="muted">Dark Green</div></div>
        <span style="color:var(--green);">Change</span>
      </div>
      <div class="setting-row">
        <div><strong>Security</strong><div class="muted">Seed phrase & biometrics</div></div>
        <span style="color:var(--green);">Manage</span>
      </div>
      <div class="setting-row">
        <div><strong>Default Networks</strong><div class="muted">Ethereum, Solana, Canton</div></div>
        <span style="color:var(--green);">Edit</span>
      </div>
    </div>
  </main>
</body>
</html>
