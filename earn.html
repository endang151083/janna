<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janna Wallet — Earn</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #00c853; --bg: #070b07; --sidebar: #0d120d; --card: #111811; --text: #fff; --muted: #8a9a8a; --border: #1a2a1a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 24px 16px; }
    .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; padding: 0 8px; }
    .logo-img { width: 40px; height: 40px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; }
    .logo-text { font-weight: 700; font-size: 1.2rem; }
    .nav-item { padding: 12px 16px; border-radius: 8px; color: var(--muted); text-decoration: none; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
    .nav-item:hover, .nav-item.active { background: #1a2a1a; color: var(--green); }
    .main { flex: 1; padding: 24px 32px; }
    .btn { background: var(--green); color: #000; padding: 8px 16px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .pool { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #0d140d; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
    .apy { color: var(--green); font-weight: 700; font-size: 1.2rem; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) { body { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo-img">J</div>
      <div class="logo-text">Janna Wallet</div>
    </div>
    <a href="janna-wallet-dashboard.html" class="nav-item">🏠 Dashboard</a>
    <a href="wallets.html" class="nav-item">💼 Wallets</a>
    <a href="swap.html" class="nav-item">🔄 Swap</a>
    <a href="earn.html" class="nav-item active">📈 Earn</a>
    <a href="settings.html" class="nav-item">⚙️ Settings</a>
  </aside>
  <main class="main">
    <h1 style="font-size:1.8rem; margin-bottom:8px;">Earn</h1>
    <p class="muted" style="margin-bottom:32px;">Staking and yield opportunities across networks</p>
    <div class="card">
      <h3 style="color:var(--green); margin-bottom:16px;">Yield Opportunities</h3>
      <div class="pool">
        <div><strong>ETH Staking</strong><div class="muted">Ethereum</div></div>
        <div style="text-align:right;"><div class="apy">4.8% APY</div><button class="btn" onclick="alert('Stake ETH')">Stake</button></div>
      </div>
      <div class="pool">
        <div><strong>SOL Liquid Staking</strong><div class="muted">Solana</div></div>
        <div style="text-align:right;"><div class="apy">6.2% APY</div><button class="btn" onclick="alert('Stake SOL')">Stake</button></div>
      </div>
      <div class="pool">
        <div><strong>Canton Privacy Yield</strong><div class="muted">Canton</div></div>
        <div style="text-align:right;"><div class="apy">5.5% APY</div><button class="btn" onclick="alert('Stake CTN')">Stake</button></div>
      </div>
    </div>
  </main>
</body>
</html>
